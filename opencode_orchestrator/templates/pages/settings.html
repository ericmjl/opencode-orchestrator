{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Settings</h1>
</div>

<div class="settings-section">
    <h2>Agent Connections</h2>
    <p class="settings-desc">Configure agents by providing the command to start them and the port they'll listen on.</p>
    
    <div class="info-section" style="margin-bottom: 1rem;">
        <form hx-post="/api/agents/form" hx-target="#agent-list" hx-swap="outerHTML">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="e.g., opencode" required>
            </div>
            <div class="form-group">
                <label for="port">Port</label>
                <input type="number" id="port" name="port" placeholder="e.g., 3023" value="3000" required>
            </div>
            <div class="form-group">
                <label for="cwd">Working Directory</label>
                <input type="text" id="cwd" name="cwd" placeholder="e.g., ~/projects/myproject">
            </div>
            <button type="submit" class="btn btn-primary">Add Agent</button>
        </form>
    </div>

    {% include "partials/agent-list.html" %}
</div>
{% endblock %}
