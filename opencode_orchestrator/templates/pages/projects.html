{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Projects</h1>
</div>

<div class="info-section" style="margin-bottom: 1rem;">
    <form
        hx-post="/api/projects/form"
        hx-target="#projects-list"
        hx-swap="outerHTML"
    >
        <div class="form-group">
            <label for="path">Project Path</label>
            <input type="text" id="path" name="path" placeholder="~/Documents/project or /absolute/path" required>
        </div>
        <div class="form-group">
            <label for="name">Name (optional)</label>
            <input type="text" id="name" name="name">
        </div>
        <button type="submit" class="btn btn-primary">Register Project</button>
    </form>
</div>

{% include "partials/project-list.html" %}
{% endblock %}
