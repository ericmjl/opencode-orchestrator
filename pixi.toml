[workspace]
name = "opencode-orchestrator"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
channels = ["conda-forge", "pypi"]

[dependencies]
python = ">=3.12"
fastapi = ">=0.115.0"
uvicorn = ">=0.34.0"
aiosqlite = ">=0.20.0"
jinja2 = ">=3.1.4"
python-multipart = ">=0.0.20"
httpx = ">=0.28.1"
watchfiles = ">=0.26.0"
websockets = ">=12.0"
markdown-it-py = ">=4.0.0"
bleach = ">=6.2.0"

[tasks]
start = "python -m opencode_orchestrator.app"

[pypi-dependencies]
pytest = ">=9.0.2, <10"
pytest-asyncio = ">=1.3.0, <2"
httpx = "*"
playwright = ">=1.58.0, <2"
pytest-playwright = ">=0.7.2, <0.8"
ruff = ">=0.15.8, <0.16"
